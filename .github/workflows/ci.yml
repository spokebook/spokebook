# Runs the linters (including gosec and gofumpt, see .golangci.yml), govulncheck, a check that the
# sqlc code is generated from the current queries, and the tests. On main, semantic-release then
# derives the next version from the commit messages (Conventional Commits), tags it and creates a
# GitHub release, and the image is built and pushed to ghcr.io. Pushing a tag v* by hand builds the
# image for that tag.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff
      - run: go test ./...

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write # tag and release
      issues: write # comment on released issues
      pull-requests: write # comment on released pull requests
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # semantic-release and all its dependencies are pinned in .github/release/package-lock.json;
      # --ignore-scripts keeps install scripts of dependencies from running in this job.
      - run: npm ci --prefix .github/release --ignore-scripts --no-audit --no-fund
      - id: release
        run: .github/release/node_modules/.bin/semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: [test, release]
    # release is skipped for tag pushes, so always() keeps this job from being skipped with it.
    if: >-
      always() && needs.test.result == 'success' &&
      (needs.release.outputs.version != '' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/spokebook/spokebook
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to ghcr.io
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
      - name: Build and push
        run: |
          version=${RELEASED:-${REF_NAME#v}}
          docker build --build-arg VERSION="v$version" \
            -t "$IMAGE:$version" -t "$IMAGE:${version%.*}" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
        env:
          RELEASED: ${{ needs.release.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
